    q: "Quantos óvulos funcionais são formados a partir de uma ovogônia após a meiose?",
    options: [
      "4 óvulos iguais",
      "1 óvulo e 3 corpúsculos polares",
      "2 óvulos e 2 corpúsculos polares",
      "Nenhum óvulo"
    ],
    correct: 1
  },
  {
    tag: "biologia",
    q: "Os Corpúsculos polares, formados durante a ovogênese, são:",
    options: [
      "Células que se tornam espermatozoides",
      "Pequenas células não funcionais que degeneram, resultado da divisão desigual do citoplasma",
      "O mesmo que os óvulos maduros",
      "Estruturas encontradas apenas nos testículos"
    ],
    correct: 1
  },
  {
    tag: "biologia",
    q: "Qual é a principal diferença entre a Espermatogênese e a Ovogênese quanto à quantidade e ao tamanho das células formadas?",
    options: [
      "Ambas formam 4 células idênticas em tamanho",
      "A espermatogênese forma 4 espermatozoides iguais; a ovogênese forma 1 óvulo grande e 3 corpúsculos polares pequenos",
      "A ovogênese forma 4 óvulos grandes",
      "A espermatogênese ocorre nos ovários"
    ],
    correct: 1
  }
];

let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];

const tagNames = { quimica: "🧪 QUÍMICA", fisica: "🌊 FÍSICA", biologia: "🧬 BIOLOGIA" };
const letters = ["A", "B", "C", "D"];

const questionTag = document.getElementById("question-tag");
const questionCounter = document.getElementById("question-counter");
const questionText = document.getElementById("question-text");
const optionsDiv = document.getElementById("options");
const feedbackDiv = document.getElementById("feedback");
const nextBtn = document.getElementById("next-btn");
const progressBar = document.getElementById("progress-bar");
const quizArea = document.getElementById("quiz-area");
const resultArea = document.getElementById("result-area");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

let order = [];

function initOrder() {
  order = shuffle([...Array(questions.length).keys()]);
}

function loadQuestion() {
  answered = false;
  feedbackDiv.className = "";
  feedbackDiv.style.display = "none";
  nextBtn.style.display = "none";

  const qIndex = order[current];
  const q = questions[qIndex];

  questionTag.textContent = tagNames[q.tag];
  questionTag.className = "tag " + q.tag;
  questionCounter.textContent = `Pergunta ${current + 1} de ${questions.length}`;
  questionText.textContent = q.q;

  optionsDiv.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<div class="box"></div><div>${opt}</div>`;
    div.addEventListener("click", () => selectOption(i, div, q));
    optionsDiv.appendChild(div);
  });

  progressBar.style.width = ((current) / questions.length * 100) + "%";
}

function selectOption(i, div, q) {
  if (answered) return;
  answered = true;

  const allOptions = optionsDiv.querySelectorAll(".option");
  allOptions.forEach((opt, idx) => {
    const box = opt.querySelector(".box");
    if (idx === q.correct) {
      opt.classList.add("correct");
      box.textContent = "X";
    }
    if (idx === i && i !== q.correct) {
      opt.classList.add("wrong");
      box.textContent = "X";
    }
  });

  const isCorrect = i === q.correct;
  if (isCorrect) score++;

  userAnswers.push({
    question: q.q,
    tag: q.tag,
    correct: isCorrect,
    yourAnswer: q.options[i],
    correctAnswer: q.options[q.correct]
  });

  feedbackDiv.textContent = isCorrect ? "✅ Correto! Muito bem." : "❌ Resposta incorreta. Veja a opção certa marcada acima.";
  feedbackDiv.className = isCorrect ? "ok" : "bad";

  nextBtn.style.display = "block";
  nextBtn.textContent = current === questions.length - 1 ? "Ver resultado final →" : "Próxima pergunta →";
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    loadQuestion();
  }
});

function showResult() {
  quizArea.style.display = "none";
  resultArea.style.display = "block";
  progressBar.style.width = "100%";

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById("score-display").textContent = `${score} / ${questions.length}`;

  let msg = "";
  if (pct >= 80) msg = "🏆 Excelente! Você domina o conteúdo.";
  else if (pct >= 60) msg = "👍 Bom trabalho! Revise os pontos que errou.";
  else if (pct >= 40) msg = "📖 Precisa estudar um pouco mais.";
  else msg = "💪 Não desista, revise a matéria e tente novamente!";

  document.getElementById("score-msg").textContent = `${pct}% de acertos — ${msg}`;

  const summaryDiv = document.getElementById("summary");
  summaryDiv.innerHTML = "<strong>Resumo das respostas:</strong>";
  userAnswers.forEach((a, idx) => {
    const line = document.createElement("div");
    line.innerHTML = `${a.correct ? "✅" : "❌"} <strong>${idx + 1}.</strong> ${a.question}` +
      (a.correct ? "" : `<br><span style="color:#922b21">Sua resposta: ${a.yourAnswer}</span><br><span style="color:#196f3d">Correta: ${a.correctAnswer}</span>`);
    summaryDiv.appendChild(line);
  });
}

document.getElementById("restart-btn").addEventListener("click", () => {
  current = 0;
  score = 0;
  userAnswers = [];
  resultArea.style.display = "none";
  quizArea.style.display = "block";
  initOrder();
  loadQuestion();
});

initOrder();
loadQuestion();
</script>
</body>
</html>
